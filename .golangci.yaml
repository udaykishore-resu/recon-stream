version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    errorlint:
      errorf: true
    gosec:
      excludes:
        - G404 # math/rand is fine for the deterministic sample generator
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, disableStutteringCheck]
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, unparam]
      - path: examples/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
