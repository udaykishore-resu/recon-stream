{{- /*
Secrets are managed outside the chart (External Secrets Operator, Vault Agent,
sealed-secrets). This template only documents the expected shape; it renders
nothing unless you explicitly opt in for local experiments.
*/}}
{{- if and (hasKey .Values "devSecret") .Values.devSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalSecret.name }}
  labels:
    {{- include "recon-stream.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.externalSecret.postgresDSNKey }}: {{ .Values.devSecret.postgresDSN | quote }}
{{- end }}
